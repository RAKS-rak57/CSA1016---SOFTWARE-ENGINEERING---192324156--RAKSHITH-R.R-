name: EXP-19 CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t exp19-cicd-demo .

      - name: Test Docker Image
        run: docker run --rm exp19-cicd-demo nginx -t

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        run: |
          docker tag exp19-cicd-demo ${{ secrets.DOCKERHUB_USERNAME }}/exp19-cicd-demo:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/exp19-cicd-demo:latest