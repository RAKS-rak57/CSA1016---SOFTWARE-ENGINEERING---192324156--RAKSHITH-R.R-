apiVersion: apps/v1
kind: Deployment
metadata:
  name: exp23-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: exp23-frontend
  template:
    metadata:
      labels:
        app: exp23-frontend
    spec:
      containers:
        - name: frontend
          image: rakshithrr/exp23-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: exp23-frontend-service
spec:
  selector:
    app: exp23-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32203
  type: NodePort