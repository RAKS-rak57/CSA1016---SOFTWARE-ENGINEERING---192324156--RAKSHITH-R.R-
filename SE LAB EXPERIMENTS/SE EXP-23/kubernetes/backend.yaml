apiVersion: apps/v1
kind: Deployment
metadata:
  name: exp23-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exp23-backend
  template:
    metadata:
      labels:
        app: exp23-backend
    spec:
      containers:
        - name: backend
          image: rakshithrr/exp23-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: exp23-backend-service
spec:
  selector:
    app: exp23-backend
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP