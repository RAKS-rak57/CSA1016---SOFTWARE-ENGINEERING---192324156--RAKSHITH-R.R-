apiVersion: apps/v1
kind: Deployment
metadata:
  name: exp23-database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exp23-database
  template:
    metadata:
      labels:
        app: exp23-database
    spec:
      containers:
        - name: database
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: exp23db
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres123
---
apiVersion: v1
kind: Service
metadata:
  name: exp23-database-service
spec:
  selector:
    app: exp23-database
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP