<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Static Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            text-align: center;
            padding: 80px;
        }

        .container {
            background: white;
            max-width: 700px;
            margin: auto;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #1f2937;
        }

        p {
            color: #4b5563;
            font-size: 18px;
        }

        .badge {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Static Website with Docker</h1>
        <p>This website is containerized and served using Nginx.</p>
        <p>LAB EX16 - Software Engineering</p>
        <div class="badge">Docker + Nginx</div>
    </div>
</body>
</html>
